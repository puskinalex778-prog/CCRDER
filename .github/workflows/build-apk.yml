name: Build NFC PAY APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Unit Tests & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --stacktrace

      - name: Rename APKs for clarity
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/NFC-PAY-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/NFC-PAY-release-unsigned.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFC-PAY-debug-apk
          path: artifacts/NFC-PAY-debug.apk
          retention-days: 30

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFC-PAY-release-unsigned-apk
          path: artifacts/NFC-PAY-release-unsigned.apk
          retention-days: 30

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/NFC-PAY-debug.apk
            artifacts/NFC-PAY-release-unsigned.apk
